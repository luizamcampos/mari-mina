<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mariana Mina — portfólio</title>

  <style>
    :root {
      --ui: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: var(--ui);
    }

    body {
      background: #d50d0a;
      color: white;
    }

    button {
      font: inherit;
    }

    .desktop {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-image: url("fundo.PNG");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      user-select: none;
    }

    .name {
      position: absolute;
      top: 22px;
      left: 26px;
      z-index: 3;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.6px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.32);
    }

    .help {
      position: absolute;
      bottom: 18px;
      left: 50%;
      z-index: 3;
      transform: translateX(-50%);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    .desktop-item {
      position: absolute;
      z-index: 4;
      width: 110px;
      cursor: grab;
      touch-action: none;
      text-align: center;
    }

    .desktop-item.dragging {
      cursor: grabbing;
      z-index: 30;
    }

    .file {
      appearance: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      color: white;
      cursor: inherit;
    }

    .thumb {
      width: 78px;
      height: 58px;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.94);
      background: #212121;
      box-shadow: 0 3px 9px rgba(0, 0, 0, 0.38);
    }

    .thumb video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .file-name {
      display: block;
      width: 130px;
      margin-top: 7px;
      color: white;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.05;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.52);
      overflow-wrap: anywhere;
    }

    .folder {
      appearance: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      color: white;
      cursor: inherit;
    }

    .folder img {
      width: 88px;
      height: auto;
      pointer-events: none;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.24));
    }

    .folder span {
      display: block;
      width: 130px;
      margin-top: 5px;
      font-size: 12px;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .window {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 100;
      display: none;
      width: min(780px, 88vw);
      transform: translate(-50%, -50%);
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.25);
      border-radius: 15px;
      background: #121212;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.6);
    }

    .window.open {
      display: block;
    }

    .titlebar {
      display: flex;
      align-items: center;
      height: 46px;
      padding: 0 16px;
      background: linear-gradient(#f9f9f9, #e7e7e7);
      color: #4c4c4c;
    }

    .traffic {
      display: flex;
      gap: 9px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
    }

    .dot.red {
      background: #ff5f57;
    }

    .dot.yellow {
      background: #ffbd2e;
    }

    .dot.green {
      background: #28c840;
    }

    .window-title {
      flex: 1;
      padding: 0 18px;
      overflow: hidden;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .window-body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      background: #111;
    }

    .window video {
      display: block;
      width: 100%;
      max-height: calc(100vh - 160px);
      background: #111;
    }

    .info-window {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 110;
      display: none;
      width: min(620px, 88vw);
      transform: translate(-50%, -50%);
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.25);
      border-radius: 15px;
      background: #f5f5f7;
      color: #111;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.6);
    }

    .info-window.open {
      display: block;
    }

    .info-content {
      max-height: min(65vh, 560px);
      overflow: auto;
      padding: 30px;
      color: white;
      background: #1333ea;
      font-size: clamp(22px, 3vw, 43px);
      font-weight: 300;
      line-height: 1.14;
      letter-spacing: -1.6px;
    }

    .info-content.small {
      font-size: 20px;
      line-height: 1.35;
      letter-spacing: -0.4px;
    }

    .info-content a {
      color: white;
    }

    @media (max-width: 650px) {
      .desktop-item {
        width: 92px;
      }

      .thumb {
        width: 66px;
        height: 50px;
      }

      .folder img {
        width: 70px;
      }

      .file-name,
      .folder span {
        font-size: 10px;
      }

      .name {
        top: 14px;
        left: 16px;
      }

      .help {
        bottom: 10px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="desktop" id="desktop">
    <div class="name">Mariana Mina</div>
    <div class="help">arraste os arquivos ou clique para abrir</div>

    <div class="desktop-item" style="left: 11%; top: 18%;">
      <button class="file" data-video="video1.MP4" data-title="CRICRI-ONLINE-V3.mp4">
        <span class="thumb">
          <video src="video1.MP4" muted playsinline preload="metadata"></video>
        </span>
        <span class="file-name">CRICRI-ONLINE-V3.mp4</span>
      </button>
    </div>

    <div class="desktop-item" style="left: 36%; top: 15%;">
      <button class="file" data-video="video2.MP4" data-title="video02.MP4">
        <span class="thumb">
          <video src="video2.MP4" muted playsinline preload="metadata"></video>
        </span>
        <span class="file-name">video02.MP4</span>
      </button>
    </div>

    <div class="desktop-item" style="left: 63%; top: 22%;">
      <button class="file" data-video="video3.MP4" data-title="video03.MP4">
        <span class="thumb">
          <video src="video3.MP4" muted playsinline preload="metadata"></video>
        </span>
        <span class="file-name">video03.MP4</span>
      </button>
    </div>

    <div class="desktop-item" style="left: 20%; top: 52%;">
      <button class="file" data-video="video4.MP4" data-title="video04.MP4">
        <span class="thumb">
          <video src="video4.MP4" muted playsinline preload="metadata"></video>
        </span>
        <span class="file-name">video04.MP4</span>
      </button>
    </div>

    <div class="desktop-item" style="left: 49%; top: 48%;">
      <button class="file" data-video="video5.MP4" data-title="video05.MP4">
        <span class="thumb">
          <video src="video5.MP4" muted playsinline preload="metadata"></video>
        </span>
        <span class="file-name">video05.MP4</span>
      </button>
    </div>

    <div class="desktop-item" style="left: 78%; top: 50%;">
      <button class="file" data-video="video6.MP4" data-title="video06.MP4">
        <span class="thumb">
          <video src="video6.MP4" muted playsinline preload="metadata"></video>
        </span>
        <span class="file-name">video06.MP4</span>
      </button>
    </div>

    <div class="desktop-item" style="left: 40%; top: 72%;">
      <button class="file" data-video="video7.MP4" data-title="video07.MP4">
        <span class="thumb">
          <video src="video7.MP4" muted playsinline preload="metadata"></video>
        </span>
        <span class="file-name">video07.MP4</span>
      </button>
    </div>

    <div class="desktop-item" style="left: 69%; top: 70%;">
      <button class="folder" data-info="about">
        <img src="folder.PNG" alt="" draggable="false" />
        <span>sobre mim</span>
      </button>
    </div>

    <div class="desktop-item" style="left: 8%; top: 72%;">
      <button class="folder" data-info="resume">
        <img src="folder.PNG" alt="" draggable="false" />
        <span>currículo</span>
      </button>
    </div>

    <div class="desktop-item" style="left: 82%; top: 76%;">
      <button class="folder" data-info="contact">
        <img src="folder.PNG" alt="" draggable="false" />
        <span>contato</span>
      </button>
    </div>
  </main>

  <section class="window" id="videoWindow" aria-hidden="true">
    <div class="titlebar">
      <div class="traffic">
        <button class="dot red" id="closeVideo" aria-label="Fechar"></button>
        <button class="dot yellow" id="minimizeVideo" aria-label="Minimizar"></button>
        <button class="dot green" id="fullScreenVideo" aria-label="Tela cheia"></button>
      </div>
      <div class="window-title" id="videoTitle">vídeo</div>
    </div>
    <div class="window-body">
      <video id="mainVideo" controls playsinline></video>
    </div>
  </section>

  <section class="info-window" id="infoWindow" aria-hidden="true">
    <div class="titlebar">
      <div class="traffic">
        <button class="dot red" id="closeInfo" aria-label="Fechar"></button>
        <button class="dot yellow" id="minimizeInfo" aria-label="Minimizar"></button>
        <button class="dot green" id="maximizeInfo" aria-label="Ampliar"></button>
      </div>
      <div class="window-title" id="infoTitle">pasta</div>
    </div>
    <div class="info-content" id="infoContent"></div>
  </section>

  <script>
    const desktop = document.getElementById("desktop");
    const videoWindow = document.getElementById("videoWindow");
    const mainVideo = document.getElementById("mainVideo");
    const videoTitle = document.getElementById("videoTitle");

    const infoWindow = document.getElementById("infoWindow");
    const infoTitle = document.getElementById("infoTitle");
    const infoContent = document.getElementById("infoContent");

    const folderContent = {
      about: {
        title: "sobre mim",
        text: `
          <div>
            Mariana Mina é artista e criadora.
            <br><br>
            Aqui você pode escrever um texto maior sobre ela, sua pesquisa,
            trabalhos, referências e tudo que quiser apresentar.
          </div>
        `,
        small: false
      },

      resume: {
        title: "currículo",
        text: `
          <div>
            <strong>Mariana Mina</strong><br><br>
            Direção criativa / audiovisual / arte.<br><br>
            Adicione aqui formação, exposições, projetos, clientes
            e experiências profissionais.
          </div>
        `,
        small: true
      },

      contact: {
        title: "contato",
        text: `
          <div>
            <strong>contato</strong><br><br>
            email@exemplo.com<br>
            instagram.com/seuinstagram
          </div>
        `,
        small: true
      }
    };

    function openVideo(source, title) {
      mainVideo.pause();
      mainVideo.src = source;
      mainVideo.load();

      videoTitle.textContent = title;
      videoWindow.classList.add("open");
      videoWindow.setAttribute("aria-hidden", "false");

      mainVideo.play().catch(() => {
        /* o botão play aparecerá caso o navegador bloqueie */
      });
    }

    function closeVideo() {
      mainVideo.pause();
      mainVideo.removeAttribute("src");
      mainVideo.load();
      videoWindow.classList.remove("open");
      videoWindow.setAttribute("aria-hidden", "true");
    }

    function openInfo(type) {
      const data = folderContent[type];

      infoTitle.textContent = data.title;
      infoContent.innerHTML = data.text;
      infoContent.classList.toggle("small", data.small);

      infoWindow.classList.add("open");
      infoWindow.setAttribute("aria-hidden", "false");
    }

    function closeInfo() {
      infoWindow.classList.remove("open");
      infoWindow.setAttribute("aria-hidden", "true");
    }

    document.querySelectorAll(".file").forEach((file) => {
      file.addEventListener("click", () => {
        if (file.closest(".desktop-item").dataset.dragged === "true") return;

        openVideo(file.dataset.video, file.dataset.title);
      });
    });

    document.querySelectorAll(".folder").forEach((folder) => {
      folder.addEventListener("click", () => {
        if (folder.closest(".desktop-item").dataset.dragged === "true") return;

        openInfo(folder.dataset.info);
      });
    });

    document.getElementById("closeVideo").addEventListener("click", closeVideo);
    document.getElementById("minimizeVideo").addEventListener("click", () => {
      videoWindow.classList.remove("open");
    });

    document.getElementById("fullScreenVideo").addEventListener("click", () => {
      if (mainVideo.requestFullscreen) {
        mainVideo.requestFullscreen();
      } else if (mainVideo.webkitEnterFullscreen) {
        mainVideo.webkitEnterFullscreen();
      }
    });

    document.getElementById("closeInfo").addEventListener("click", closeInfo);
    document.getElementById("minimizeInfo").addEventListener("click", () => {
      infoWindow.classList.remove("open");
    });

    document.getElementById("maximizeInfo").addEventListener("click", () => {
      infoWindow.classList.toggle("fullscreen-info");
      if (infoWindow.classList.contains("fullscreen-info")) {
        infoWindow.style.width = "94vw";
      } else {
        infoWindow.style.width = "";
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeVideo();
        closeInfo();
      }
    });

    /* Capas sempre paradas */
    document.querySelectorAll(".thumb video").forEach((capa) => {
      capa.pause();

      capa.addEventListener("loadeddata", () => {
        capa.currentTime = 0;
        capa.pause();
      });

      capa.addEventListener("play", () => {
        capa.pause();
        capa.currentTime = 0;
      });
    });

    /* Arrastar arquivos e pastas */
    document.querySelectorAll(".desktop-item").forEach((item) => {
      let offsetX = 0;
      let offsetY = 0;
      let moved = false;

      item.addEventListener("pointerdown", (event) => {
        if (event.button !== undefined && event.button !== 0) return;

        event.preventDefault();

        const rect = item.getBoundingClientRect();
        offsetX = event.clientX - rect.left;
        offsetY = event.clientY - rect.top;
        moved = false;

        item.classList.add("dragging");
        item.setPointerCapture(event.pointerId);
      });

      item.addEventListener("pointermove", (event) => {
        if (!item.classList.contains("dragging")) return;

        const desktopRect = desktop.getBoundingClientRect();

        let x = event.clientX - desktopRect.left - offsetX;
        let y = event.clientY - desktopRect.top - offsetY;

        x = Math.max(0, Math.min(x, desktopRect.width - item.offsetWidth));
        y = Math.max(0, Math.min(y, desktopRect.height - item.offsetHeight));

        item.style.left = `${x}px`;
        item.style.top = `${y}px`;

        moved = true;
      });

      function finishDrag(event) {
        if (!item.classList.contains("dragging")) return;

        item.classList.remove("dragging");

        if (item.hasPointerCapture(event.pointerId)) {
          item.releasePointerCapture(event.pointerId);
        }

        if (moved) {
          item.dataset.dragged = "true";

          setTimeout(() => {
            item.dataset.dragged = "false";
          }, 100);
        }
      }

      item.addEventListener("pointerup", finishDrag);
      item.addEventListener("pointercancel", finishDrag);
    });
  </script>
</body>
</html>
