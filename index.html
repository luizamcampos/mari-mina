<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#d80a0a" />
  <title>Mariana Mina — portfólio</title>

  <style>
    :root {
      --ui: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #d80a0a;
      color: white;
      font-family: var(--ui);
    }

    .desktop {
      min-height: 100svh;
      position: relative;
      overflow: hidden;
      background: #d80a0a url("fundo.PNG") center / cover no-repeat;
    }

    .desktop::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.03);
      pointer-events: none;
    }

    .brand {
      position: absolute;
      z-index: 1;
      top: clamp(18px, 3vw, 38px);
      left: clamp(18px, 3vw, 42px);
      margin: 0;
      font-size: clamp(16px, 1.55vw, 23px);
      line-height: 1;
      font-weight: 400;
      letter-spacing: -0.055em;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
    }

    .file {
      appearance: none;
      position: absolute;
      z-index: 2;
      width: 120px;
      display: grid;
      justify-items: center;
      gap: 7px;
      padding: 0;
      border: 0;
      background: transparent;
      color: white;
      font: inherit;
      cursor: grab;
      touch-action: none;
      user-select: none;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
    }

    .file:active {
      cursor: grabbing;
    }

    .file:focus-visible {
      outline: 1px solid white;
      outline-offset: 5px;
      border-radius: 4px;
    }

    .thumb {
      width: 68px;
      height: 51px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.92);
      background: #111;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
    }

    .thumb video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      pointer-events: none;
    }

    .file-name {
      max-width: 125px;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.025em;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .video-1 {
      left: 11%;
      top: 17%;
    }

    .video-2 {
      left: 26%;
      top: 25%;
    }

    .video-3 {
      left: 65%;
      top: 17%;
    }

    .video-4 {
      left: 78%;
      top: 34%;
    }

    .video-5 {
      left: 14%;
      top: 59%;
    }

    .video-6 {
      left: 67%;
      top: 66%;
    }

    .folder {
      left: 84%;
      bottom: 10%;
      width: 100px;
    }

    .folder img {
      width: 72px;
      display: block;
      pointer-events: none;
      filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.3));
    }

    .folder .file-name {
      font-size: 13px;
    }

    .hint {
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      margin: 0;
      font-size: 12px;
      text-shadow: 0 1px 4px #000;
      opacity: 0.9;
      white-space: nowrap;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 4;
      background: rgba(0, 0, 0, 0.15);
    }

    .overlay.visible {
      display: block;
    }

    .window {
      display: none;
      position: fixed;
      z-index: 5;
      left: 50%;
      top: 50%;
      width: min(800px, calc(100vw - 32px));
      overflow: hidden;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      background: #f2f2f2;
      color: #111;
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.62);
    }

    .window.open {
      display: block;
      animation: open 0.18s ease-out;
    }

    @keyframes open {
      from {
        opacity: 0;
        transform: translate(-50%, -45%) scale(0.94);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .titlebar {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      border-bottom: 1px solid #bababa;
      background: linear-gradient(#f5f5f5, #dedede);
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .titlebar:active {
      cursor: grabbing;
    }

    .dot {
      width: 13px;
      height: 13px;
      flex: 0 0 auto;
      padding: 0;
      border: 1px solid rgba(0, 0, 0, 0.16);
      border-radius: 50%;
      cursor: pointer;
    }

    .red {
      background: #ff5f57;
    }

    .yellow {
      background: #ffbd2e;
    }

    .green {
      background: #28c840;
    }

    .title {
      margin-left: 6px;
      color: #3a3a3a;
      font-size: 13px;
      font-weight: 600;
      pointer-events: none;
    }

    .player {
      width: 100%;
      max-height: calc(100svh - 140px);
      display: block;
      background: black;
    }

    .contact-window {
      width: min(430px, calc(100vw - 32px));
    }

    .contact {
      display: block;
      padding: 24px;
      background: #f7f7f7;
      color: #111;
    }

    .contact p {
      margin: 0 0 18px;
      font-size: 19px;
      letter-spacing: -0.04em;
    }

    .contact a {
      display: block;
      width: max-content;
      margin: 10px 0;
      color: #0d53ca;
      font-size: 17px;
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    .window.full {
      width: 100vw !important;
      height: 100svh !important;
      max-width: none;
      left: 0 !important;
      top: 0 !important;
      transform: none !important;
      border-radius: 0;
    }

    .window.full .titlebar {
      height: 44px;
    }

    .window.full .player {
      height: calc(100svh - 44px);
      max-height: none;
      object-fit: contain;
    }

    @media (max-width: 620px) {
      .file {
        transform: scale(0.9);
      }

      .video-1 {
        left: 5%;
        top: 15%;
      }

      .video-2 {
        left: 35%;
        top: 22%;
      }

      .video-3 {
        left: 65%;
        top: 15%;
      }

      .video-4 {
        left: 64%;
        top: 44%;
      }

      .video-5 {
        left: 4%;
        top: 56%;
      }

      .video-6 {
        left: 34%;
        top: 70%;
      }

      .folder {
        left: 72%;
        top: 72%;
        bottom: auto;
      }

      .hint {
        bottom: 9px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main class="desktop" id="desktop">
    <h1 class="brand">Mariana Mina</h1>

    <button class="file video-1 draggable-file" type="button" data-video="video1.MP4" data-title="CRICRI-ONLINE-V3.mp4">
      <span class="thumb">
        <video src="video1.MP4" muted playsinline preload="auto"></video>
      </span>
      <span class="file-name">CRICRI-ONLINE-V3.mp4</span>
    </button>

    <button class="file video-2 draggable-file" type="button" data-video="video02.MP4" data-title="video02.MP4">
      <span class="thumb">
        <video src="video02.MP4" muted playsinline preload="auto"></video>
      </span>
      <span class="file-name">video02.MP4</span>
    </button>

    <button class="file video-3 draggable-file" type="button" data-video="video03.MP4" data-title="video03.MP4">
      <span class="thumb">
        <video src="video03.MP4" muted playsinline preload="auto"></video>
      </span>
      <span class="file-name">video03.MP4</span>
    </button>

    <button class="file video-4 draggable-file" type="button" data-video="video04.MP4" data-title="video04.MP4">
      <span class="thumb">
        <video src="video04.MP4" muted playsinline preload="auto"></video>
      </span>
      <span class="file-name">video04.MP4</span>
    </button>

    <button class="file video-5 draggable-file" type="button" data-video="video05.MP4" data-title="video05.MP4">
      <span class="thumb">
        <video src="video05.MP4" muted playsinline preload="auto"></video>
      </span>
      <span class="file-name">video05.MP4</span>
    </button>

    <button class="file video-6 draggable-file" type="button" data-video="video06.MP4" data-title="video06.MP4">
      <span class="thumb">
        <video src="video06.MP4" muted playsinline preload="auto"></video>
      </span>
      <span class="file-name">video06.MP4</span>
    </button>

    <button class="file folder draggable-file" type="button" data-open="contact-window">
      <img src="folder.PNG" alt="" draggable="false" />
      <span class="file-name">contato</span>
    </button>

    <p class="hint">arraste os arquivos ou clique para abrir</p>
  </main>

  <div class="overlay" id="overlay"></div>

  <section class="window" id="video-window" aria-label="Vídeo">
    <div class="titlebar">
      <button class="dot red" data-close aria-label="Fechar"></button>
      <span class="dot yellow"></span>
      <button class="dot green" data-full aria-label="Expandir vídeo"></button>
      <span class="title" id="video-title">vídeo</span>
    </div>

    <video class="player" id="main-video" controls playsinline></video>
  </section>

  <section class="window contact-window" id="contact-window" aria-label="Contato">
    <div class="titlebar">
      <button class="dot red" data-close aria-label="Fechar"></button>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="title">contato</span>
    </div>

    <div class="contact">
      <p>Vamos conversar?</p>

      <!-- Trocar pelo e-mail e Instagram reais dela -->
      <a href="mailto:email@exemplo.com">email@exemplo.com</a>
      <a href="#">instagram</a>
    </div>
  </section>

  <script>
    const desktop = document.querySelector("#desktop");
    const overlay = document.querySelector("#overlay");
    const mainVideo = document.querySelector("#main-video");
    const videoWindow = document.querySelector("#video-window");
    const videoTitle = document.querySelector("#video-title");

    function closeAll() {
      document.querySelectorAll(".window").forEach((win) => {
        win.classList.remove("open", "full");
        win.style.left = "";
        win.style.top = "";
        win.style.transform = "";
      });

      overlay.classList.remove("visible");
      mainVideo.pause();
    }

    document.querySelectorAll("[data-video]").forEach((file) => {
      file.addEventListener("click", () => {
        if (file.dataset.dragged === "true") return;

        mainVideo.src = file.dataset.video;
        videoTitle.textContent = file.dataset.title;
        mainVideo.currentTime = 0;
        mainVideo.muted = false;

        videoWindow.classList.add("open");
        overlay.classList.add("visible");

        mainVideo.play().catch(() => {});
      });
    });

    document.querySelectorAll("[data-open]").forEach((button) => {
      button.addEventListener("click", () => {
        if (button.dataset.dragged === "true") return;

        const target = document.querySelector(`#${button.dataset.open}`);

        target.classList.add("open");
        overlay.classList.add("visible");
      });
    });

    document.querySelectorAll("[data-close]").forEach((button) => {
      button.addEventListener("click", closeAll);
    });

    overlay.addEventListener("click", closeAll);

    document.querySelector("[data-full]").addEventListener("click", () => {
      videoWindow.classList.toggle("full");
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeAll();
    });

    function makeDesktopFilesDraggable() {
      document.querySelectorAll(".draggable-file").forEach((file) => {
        let startX = 0;
        let startY = 0;
        let initialLeft = 0;
        let initialTop = 0;
        let moved = false;

        file.addEventListener("pointerdown", (event) => {
          event.preventDefault();

          startX = event.clientX;
          startY = event.clientY;
          moved = false;

          const fileRect = file.getBoundingClientRect();
          const desktopRect = desktop.getBoundingClientRect();

          initialLeft = fileRect.left - desktopRect.left;
          initialTop = fileRect.top - desktopRect.top;

          file.setPointerCapture(event.pointerId);
        });

        file.addEventListener("pointermove", (event) => {
          if (!file.hasPointerCapture(event.pointerId)) return;

          const moveX = event.clientX - startX;
          const moveY = event.clientY - startY;

          if (Math.abs(moveX) > 5 || Math.abs(moveY) > 5) {
            moved = true;
          }

          if (!moved) return;

          const desktopRect = desktop.getBoundingClientRect();
          const fileWidth = file.offsetWidth;
          const fileHeight = file.offsetHeight;

          let newLeft = initialLeft + moveX;
          let newTop = initialTop + moveY;

          newLeft = Math.max(0, Math.min(newLeft, desktopRect.width - fileWidth));
          newTop = Math.max(0, Math.min(newTop, desktopRect.height - fileHeight));

          file.style.left = `${newLeft}px`;
          file.style.top = `${newTop}px`;
          file.style.right = "auto";
          file.style.bottom = "auto";
        });

        function finishDrag(event) {
          if (file.hasPointerCapture(event.pointerId)) {
            file.releasePointerCapture(event.pointerId);
          }

          if (moved) {
            file.dataset.dragged = "true";

            setTimeout(() => {
              file.dataset.dragged = "false";
            }, 80);
          }
        }

        file.addEventListener("pointerup", finishDrag);
        file.addEventListener("pointercancel", finishDrag);
      });
    }

    function makeWindowsDraggable() {
      document.querySelectorAll(".window").forEach((win) => {
        const titlebar = win.querySelector(".titlebar");

        let startX = 0;
        let startY = 0;
        let initialLeft = 0;
        let initialTop = 0;

        titlebar.addEventListener("pointerdown", (event) => {
          if (event.target.classList.contains("dot")) return;
          if (win.classList.contains("full")) return;

          const rect = win.getBoundingClientRect();

          startX = event.clientX;
          startY = event.clientY;
          initialLeft = rect.left;
          initialTop = rect.top;

          win.style.left = `${initialLeft}px`;
          win.style.top = `${initialTop}px`;
          win.style.transform = "none";

          titlebar.setPointerCapture(event.pointerId);
        });

        titlebar.addEventListener("pointermove", (event) => {
          if (!titlebar.hasPointerCapture(event.pointerId)) return;
          if (win.classList.contains("full")) return;

          const rect = win.getBoundingClientRect();
          const moveX = event.clientX - startX;
          const moveY = event.clientY - startY;

          let newLeft = initialLeft + moveX;
          let newTop = initialTop + moveY;

          newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - rect.width));
          newTop = Math.max(0, Math.min(newTop, window.innerHeight - 42));

          win.style.left = `${newLeft}px`;
          win.style.top = `${newTop}px`;
        });

        function finishWindowDrag(event) {
          if (titlebar.hasPointerCapture(event.pointerId)) {
            titlebar.releasePointerCapture(event.pointerId);
          }
        }

        titlebar.addEventListener("pointerup", finishWindowDrag);
        titlebar.addEventListener("pointercancel", finishWindowDrag);
      });
    }

    makeDesktopFilesDraggable();
    makeWindowsDraggable();
  </script>
</body>
</html>
