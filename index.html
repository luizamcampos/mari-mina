<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mariana Mina — portfólio</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background: #d70c09;
      color: white;
    }

    button { font: inherit; }

    .desktop {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      background: #d70c09 url("fundo.PNG") center center / cover no-repeat;
    }

    .name {
      position: absolute;
      top: 22px;
      left: 26px;
      z-index: 5;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.6px;
      text-shadow: 0 1px 4px rgba(0,0,0,.35);
    }

    .help {
      position: absolute;
      bottom: 18px;
      left: 50%;
      z-index: 5;
      transform: translateX(-50%);
      width: 100%;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 1px 4px rgba(0,0,0,.5);
      pointer-events: none;
    }

    .desktop-item {
      position: absolute;
      z-index: 4;
      width: 118px;
      text-align: center;
      cursor: grab;
      touch-action: none;
    }

    .desktop-item.dragging {
      z-index: 40;
      cursor: grabbing;
    }

    .file,
    .folder {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0;
      border: 0;
      color: white;
      background: transparent;
      cursor: inherit;
    }

    .thumb {
      display: block;
      width: 78px;
      height: 58px;
      overflow: hidden;
      border: 3px solid rgba(255,255,255,.95);
      background: #252525;
      box-shadow: 0 3px 9px rgba(0,0,0,.38);
    }

    .thumb canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .file-name,
    .folder span {
      display: block;
      width: 140px;
      margin-top: 7px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.05;
      text-shadow: 0 1px 3px rgba(0,0,0,.55);
      overflow-wrap: anywhere;
    }

    .folder img {
      width: 88px;
      height: auto;
      pointer-events: none;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,.25));
    }

    .folder span {
      margin-top: 5px;
    }

    .window,
    .info-window {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 100;
      display: none;
      width: min(780px, 90vw);
      transform: translate(-50%, -50%);
      overflow: hidden;
      border: 1px solid rgba(0,0,0,.25);
      border-radius: 15px;
      background: #111;
      box-shadow: 0 22px 60px rgba(0,0,0,.6);
    }

    .window.open,
    .info-window.open {
      display: block;
    }

    .titlebar {
      display: flex;
      align-items: center;
      height: 46px;
      padding: 0 16px;
      background: linear-gradient(#fafafa, #e5e5e5);
      color: #444;
    }

    .traffic {
      display: flex;
      gap: 9px;
    }

    .dot {
      width: 14px;
      height: 14px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
    }

    .red { background: #ff5f57; }
    .yellow { background: #ffbd2e; }
    .green { background: #28c840; }

    .window-title {
      flex: 1;
      padding: 0 18px;
      overflow: hidden;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .window-body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 250px;
      background: #111;
    }

    #mainVideo {
      display: block;
      width: 100%;
      max-height: calc(100vh - 130px);
      background: #111;
    }

    .info-window {
      background: #1333ea;
    }

    .info-content {
      max-height: min(65vh, 560px);
      overflow: auto;
      padding: 30px;
      color: white;
      font-size: clamp(23px, 3vw, 42px);
      font-weight: 300;
      line-height: 1.14;
      letter-spacing: -1.5px;
    }

    .info-content.small {
      font-size: 20px;
      line-height: 1.35;
      letter-spacing: -0.4px;
    }

    @media (max-width: 650px) {
      .desktop {
        background-size: auto 100%;
        background-position: center bottom;
      }

      .name {
        top: 23px;
        left: 27px;
        font-size: 15px;
      }

      .desktop-item {
        width: 105px;
      }

      .thumb {
        width: 76px;
        height: 84px;
      }

      .folder img {
        width: 116px;
      }

      .file-name,
      .folder span {
        width: 135px;
        font-size: 12px;
      }

      .help {
        display: none;
      }

      .item-1 { left: 0% !important; top: 22% !important; }
      .item-2 { left: 52% !important; top: 15% !important; }
      .item-contact { left: 75% !important; top: 20% !important; }

      .item-about { left: 31% !important; top: 38% !important; }
      .item-3 { left: 64% !important; top: 38% !important; }

      .item-4 { left: 1% !important; top: 55% !important; }
      .item-5 { left: 51% !important; top: 50% !important; }

      .item-resume { left: 0% !important; top: 70% !important; }
      .item-6 { left: 75% !important; top: 67% !important; }
      .item-7 { left: 20% !important; top: 87% !important; }

      .window,
      .info-window {
        width: 94vw;
        border-radius: 13px;
      }

      .info-content {
        padding: 23px;
        font-size: 28px;
      }
    }
  </style>
</head>

<body>
  <main class="desktop" id="desktop">
    <div class="name">Mariana Mina</div>
    <div class="help">arraste os arquivos ou clique para abrir</div>

    <div class="desktop-item item-1" style="left: 11%; top: 18%;">
      <button class="file" data-video="video1.MP4" data-title="CRICRI-ONLINE-V3.mp4">
        <span class="thumb"><canvas data-cover="video1.MP4"></canvas></span>
        <span class="file-name">CRICRI-ONLINE-V3.mp4</span>
      </button>
    </div>

    <div class="desktop-item item-2" style="left: 36%; top: 15%;">
      <button class="file" data-video="video2.MP4" data-title="video02.MP4">
        <span class="thumb"><canvas data-cover="video2.MP4"></canvas></span>
        <span class="file-name">video02.MP4</span>
      </button>
    </div>

    <div class="desktop-item item-3" style="left: 63%; top: 22%;">
      <button class="file" data-video="video3.MP4" data-title="video03.MP4">
        <span class="thumb"><canvas data-cover="video3.MP4"></canvas></span>
        <span class="file-name">video03.MP4</span>
      </button>
    </div>

    <div class="desktop-item item-4" style="left: 20%; top: 52%;">
      <button class="file" data-video="video4.MP4" data-title="video04.MP4">
        <span class="thumb"><canvas data-cover="video4.MP4"></canvas></span>
        <span class="file-name">video04.MP4</span>
      </button>
    </div>

    <div class="desktop-item item-5" style="left: 49%; top: 48%;">
      <button class="file" data-video="video5.MP4" data-title="video05.MP4">
        <span class="thumb"><canvas data-cover="video5.MP4"></canvas></span>
        <span class="file-name">video05.MP4</span>
      </button>
    </div>

    <div class="desktop-item item-6" style="left: 78%; top: 50%;">
      <button class="file" data-video="video6.MP4" data-title="video06.MP4">
        <span class="thumb"><canvas data-cover="video6.MP4"></canvas></span>
        <span class="file-name">video06.MP4</span>
      </button>
    </div>

    <div class="desktop-item item-7" style="left: 40%; top: 72%;">
      <button class="file" data-video="video7.MP4" data-title="video07.MP4">
        <span class="thumb"><canvas data-cover="video7.MP4"></canvas></span>
        <span class="file-name">video07.MP4</span>
      </button>
    </div>

    <div class="desktop-item item-about" style="left: 69%; top: 70%;">
      <button class="folder" data-info="about">
        <img src="folder.PNG" alt="" draggable="false">
        <span>sobre mim</span>
      </button>
    </div>

    <div class="desktop-item item-resume" style="left: 8%; top: 72%;">
      <button class="folder" data-info="resume">
        <img src="folder.PNG" alt="" draggable="false">
        <span>currículo</span>
      </button>
    </div>

    <div class="desktop-item item-contact" style="left: 82%; top: 76%;">
      <button class="folder" data-info="contact">
        <img src="folder.PNG" alt="" draggable="false">
        <span>contato</span>
      </button>
    </div>
  </main>

  <section class="window" id="videoWindow">
    <div class="titlebar">
      <div class="traffic">
        <button class="dot red" id="closeVideo"></button>
        <button class="dot yellow" id="minimizeVideo"></button>
        <button class="dot green" id="fullScreenVideo"></button>
      </div>
      <div class="window-title" id="videoTitle">vídeo</div>
    </div>

    <div class="window-body">
      <video id="mainVideo" controls playsinline></video>
    </div>
  </section>

  <section class="info-window" id="infoWindow">
    <div class="titlebar">
      <div class="traffic">
        <button class="dot red" id="closeInfo"></button>
        <button class="dot yellow" id="minimizeInfo"></button>
        <button class="dot green" id="maximizeInfo"></button>
      </div>
      <div class="window-title" id="infoTitle">pasta</div>
    </div>

    <div class="info-content" id="infoContent"></div>
  </section>

  <script>
    const desktop = document.getElementById("desktop");
    const videoWindow = document.getElementById("videoWindow");
    const mainVideo = document.getElementById("mainVideo");
    const videoTitle = document.getElementById("videoTitle");

    const infoWindow = document.getElementById("infoWindow");
    const infoTitle = document.getElementById("infoTitle");
    const infoContent = document.getElementById("infoContent");

    const folderContent = {
      about: {
        title: "sobre mim",
        text: `Mariana Mina é artista e criadora.<br><br>
        Aqui você pode colocar um texto maior contando sobre ela, sua pesquisa, seus trabalhos e referências.`,
        small: false
      },
      resume: {
        title: "currículo",
        text: `<strong>Mariana Mina</strong><br><br>
        Direção criativa / audiovisual / arte.<br><br>
        Aqui você pode adicionar sua formação, experiências, projetos e exposições.`,
        small: true
      },
      contact: {
        title: "contato",
        text: `<strong>contato</strong><br><br>
        seuemail@exemplo.com<br>
        instagram.com/seuinstagram`,
        small: true
      }
    };

    function openVideo(source, title) {
      mainVideo.pause();
      mainVideo.src = source;
      mainVideo.load();

      videoTitle.textContent = title;
      videoWindow.classList.add("open");

      mainVideo.play().catch(() => {});
    }

    function closeVideo() {
      mainVideo.pause();
      mainVideo.removeAttribute("src");
      mainVideo.load();
      videoWindow.classList.remove("open");
    }

    function openInfo(type) {
      const data = folderContent[type];

      infoTitle.textContent = data.title;
      infoContent.innerHTML = data.text;
      infoContent.classList.toggle("small", data.small);
      infoWindow.classList.add("open");
    }

    function closeInfo() {
      infoWindow.classList.remove("open");
    }

    document.querySelectorAll(".file").forEach((file) => {
      file.addEventListener("click", () => {
        if (file.closest(".desktop-item").dataset.dragged === "true") return;
        openVideo(file.dataset.video, file.dataset.title);
      });
    });

    document.querySelectorAll(".folder").forEach((folder) => {
      folder.addEventListener("click", () => {
        if (folder.closest(".desktop-item").dataset.dragged === "true") return;
        openInfo(folder.dataset.info);
      });
    });

    document.getElementById("closeVideo").addEventListener("click", closeVideo);

    document.getElementById("minimizeVideo").addEventListener("click", () => {
      videoWindow.classList.remove("open");
    });

    document.getElementById("fullScreenVideo").addEventListener("click", () => {
      if (mainVideo.requestFullscreen) {
        mainVideo.requestFullscreen();
      } else if (mainVideo.webkitEnterFullscreen) {
        mainVideo.webkitEnterFullscreen();
      }
    });

    document.getElementById("closeInfo").addEventListener("click", closeInfo);

    document.getElementById("minimizeInfo").addEventListener("click", () => {
      infoWindow.classList.remove("open");
    });

    document.getElementById("maximizeInfo").addEventListener("click", () => {
      infoWindow.style.width = infoWindow.style.width === "94vw" ? "" : "94vw";
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeVideo();
        closeInfo();
      }
    });

    /* Cria uma capa parada com um frame do próprio vídeo */
    document.querySelectorAll("canvas[data-cover]").forEach((canvas) => {
      const video = document.createElement("video");

      video.src = canvas.dataset.cover;
      video.muted = true;
      video.preload = "auto";
      video.playsInline = true;

      video.addEventListener("loadedmetadata", () => {
        video.currentTime = Math.min(0.5, video.duration / 2);
      });

      video.addEventListener("seeked", () => {
        const context = canvas.getContext("2d");

        canvas.width = 240;
        canvas.height = 180;

        const videoRatio = video.videoWidth / video.videoHeight;
        const canvasRatio = canvas.width / canvas.height;

        let sourceWidth = video.videoWidth;
        let sourceHeight = video.videoHeight;
        let sourceX = 0;
        let sourceY = 0;

        if (videoRatio > canvasRatio) {
          sourceWidth = video.videoHeight * canvasRatio;
          sourceX = (video.videoWidth - sourceWidth) / 2;
        } else {
          sourceHeight = video.videoWidth / canvasRatio;
          sourceY = (video.videoHeight - sourceHeight) / 2;
        }

        context.drawImage(
          video,
          sourceX,
          sourceY,
          sourceWidth,
          sourceHeight,
          0,
          0,
          canvas.width,
          canvas.height
        );

        video.pause();
      });
    });

    /* Arrastar arquivos e pastas */
    document.querySelectorAll(".desktop-item").forEach((item) => {
      let offsetX = 0;
      let offsetY = 0;
      let moved = false;

      item.addEventListener("pointerdown", (event) => {
        if (event.button !== undefined && event.button !== 0) return;

        event.preventDefault();

        const rect = item.getBoundingClientRect();
        offsetX = event.clientX - rect.left;
        offsetY = event.clientY - rect.top;
        moved = false;

        item.classList.add("dragging");
        item.setPointerCapture(event.pointerId);
      });

      item.addEventListener("pointermove", (event) => {
        if (!item.classList.contains("dragging")) return;

        const desktopRect = desktop.getBoundingClientRect();

        let x = event.clientX - desktopRect.left - offsetX;
        let y = event.clientY - desktopRect.top - offsetY;

        x = Math.max(0, Math.min(x, desktopRect.width - item.offsetWidth));
        y = Math.max(0, Math.min(y, desktopRect.height - item.offsetHeight));

        item.style.left = `${x}px`;
        item.style.top = `${y}px`;

        moved = true;
      });

      function finishDrag(event) {
        if (!item.classList.contains("dragging")) return;

        item.classList.remove("dragging");

        if (item.hasPointerCapture(event.pointerId)) {
          item.releasePointerCapture(event.pointerId);
        }

        if (moved) {
          item.dataset.dragged = "true";

          setTimeout(() => {
            item.dataset.dragged = "false";
          }, 120);
        }
      }

      item.addEventListener("pointerup", finishDrag);
      item.addEventListener("pointercancel", finishDrag);
    });
  </script>
</body>
</html>
