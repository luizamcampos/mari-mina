<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#d80a0a" />
  <title>Mariana Mina — portfólio</title>

  <style>
    :root {
      --ui: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #d80a0a;
      color: white;
      font-family: var(--ui);
    }

    .desktop {
      min-height: 100svh;
      position: relative;
      overflow: hidden;
      background: #d80a0a url("fundo.PNG") center / cover no-repeat;
    }

    .desktop::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.035);
      pointer-events: none;
    }

    .brand {
      position: absolute;
      z-index: 1;
      top: clamp(18px, 3vw, 38px);
      left: clamp(18px, 3vw, 42px);
      margin: 0;
      font-size: clamp(16px, 1.55vw, 23px);
      line-height: 1;
      font-weight: 400;
      letter-spacing: -0.055em;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
    }

    .file {
      appearance: none;
      border: 0;
      background: transparent;
      color: white;
      cursor: pointer;
      position: absolute;
      z-index: 1;
      width: 136px;
      display: grid;
      justify-items: center;
      gap: 8px;
      padding: 0;
      font: inherit;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      transition: transform 0.18s ease;
    }

    .file:hover,
    .file:focus-visible {
      transform: scale(1.07);
      outline: none;
    }

    .file .thumb {
      width: 94px;
      height: 70px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
      background: #111;
    }

    .file video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .file span {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.025em;
    }

    .project-one {
      left: 18%;
      top: 19%;
    }

    .folder {
      left: 72%;
      bottom: 14%;
      width: 152px;
    }

    .folder img {
      width: 120px;
      display: block;
      filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.3));
    }

    .folder span {
      font-size: 14px;
    }

    .hint {
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      margin: 0;
      font-size: 12px;
      text-shadow: 0 1px 4px #000;
      opacity: 0.9;
      white-space: nowrap;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 4;
      background: rgba(0, 0, 0, 0.15);
    }

    .overlay.visible {
      display: block;
    }

    .window {
      display: none;
      position: fixed;
      z-index: 5;
      left: 50%;
      top: 50%;
      width: min(800px, calc(100vw - 32px));
      background: #f2f2f2;
      border: 1px solid rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      overflow: hidden;
      transform: translate(-50%, -50%);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.62);
      color: #111;
    }

    .window.open {
      display: block;
      animation: open 0.18s ease-out;
    }

    @keyframes open {
      from {
        opacity: 0;
        transform: translate(-50%, -45%) scale(0.94);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .titlebar {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      background: linear-gradient(#f5f5f5, #dedede);
      border-bottom: 1px solid #bababa;
    }

    .dot {
      width: 13px;
      height: 13px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.16);
      cursor: pointer;
    }

    .red {
      background: #ff5f57;
    }

    .yellow {
      background: #ffbd2e;
    }

    .green {
      background: #28c840;
    }

    .title {
      margin-left: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #3a3a3a;
    }

    .player {
      width: 100%;
      max-height: calc(100svh - 140px);
      display: block;
      background: black;
    }

    .contact {
      display: none;
      padding: 24px;
      background: #f7f7f7;
      color: #111;
    }

    .contact p {
      margin: 0 0 18px;
      font-size: 19px;
      letter-spacing: -0.04em;
    }

    .contact a {
      display: block;
      width: max-content;
      color: #0d53ca;
      font-size: 17px;
      text-decoration: none;
      margin: 10px 0;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    .contact-window {
      width: min(430px, calc(100vw - 32px));
    }

    .window.full {
      width: 100vw;
      height: 100svh;
      max-width: none;
      border-radius: 0;
    }

    .window.full .titlebar {
      height: 44px;
    }

    .window.full .player {
      height: calc(100svh - 44px);
      max-height: none;
      object-fit: contain;
    }

    @media (max-width: 620px) {
      .project-one {
        left: 10%;
        top: 18%;
      }

      .folder {
        left: auto;
        right: 5%;
        bottom: 13%;
      }

      .hint {
        bottom: 10px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <main class="desktop">
    <h1 class="brand">Mariana Mina</h1>

    <button class="file project-one" type="button" data-open="video-window">
      <span class="thumb">
        <video src="video1.MP4" muted loop playsinline preload="metadata"></video>
      </span>
      <span>vídeo 01</span>
    </button>

    <button class="file folder" type="button" data-open="contact-window">
      <img src="folder.PNG" alt="" />
      <span>contato</span>
    </button>

    <p class="hint">clique nos arquivos para abrir</p>
  </main>

  <div class="overlay" id="overlay"></div>

  <section class="window" id="video-window">
    <div class="titlebar">
      <button class="dot red" data-close aria-label="Fechar"></button>
      <span class="dot yellow"></span>
      <button class="dot green" data-full aria-label="Expandir vídeo"></button>
      <span class="title">vídeo 01.MP4</span>
    </div>

    <video class="player" id="main-video" src="video1.MP4" controls playsinline></video>
  </section>

  <section class="window contact-window" id="contact-window">
    <div class="titlebar">
      <button class="dot red" data-close aria-label="Fechar"></button>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="title">contato</span>
    </div>

    <div class="contact">
      <p>Vamos conversar?</p>
      <a href="mailto:email@exemplo.com">email@exemplo.com</a>
      <a href="#">instagram</a>
    </div>
  </section>

  <script>
    const overlay = document.querySelector("#overlay");
    const video = document.querySelector("#main-video");

    document.querySelectorAll(".thumb video").forEach((videozinho) => {
      videozinho.play().catch(() => {});
    });

    function closeAll() {
      document.querySelectorAll(".window").forEach((window) => {
        window.classList.remove("open", "full");
      });

      overlay.classList.remove("visible");
      video.pause();
    }

    document.querySelectorAll("[data-open]").forEach((button) => {
      button.addEventListener("click", () => {
        const window = document.querySelector(`#${button.dataset.open}`);

        window.classList.add("open");
        overlay.classList.add("visible");

        if (window.id === "video-window") {
          video.currentTime = 0;
          video.muted = false;
          video.play().catch(() => {});
        }
      });
    });

    document.querySelectorAll("[data-close]").forEach((button) => {
      button.addEventListener("click", closeAll);
    });

    overlay.addEventListener("click", closeAll);

    document.querySelector("[data-full]").addEventListener("click", () => {
      document.querySelector("#video-window").classList.toggle("full");
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeAll();
    });
  </script>
</body>
</html>
