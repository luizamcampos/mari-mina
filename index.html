<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#d80a0a" />
  <title>Mariana Mina — portfólio</title>
  <style>
    :root { --ui: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; overflow:hidden; background:#d80a0a; color:#fff; font-family:var(--ui); }
    .desktop { min-height:100svh; position:relative; overflow:hidden; background:#d80a0a url('fundo.PNG') center / cover no-repeat; }
    .desktop::after { content:""; position:absolute; inset:0; background:rgba(0,0,0,.035); pointer-events:none; }
    .brand { position:absolute; z-index:1; top:clamp(18px,3vw,38px); left:clamp(18px,3vw,42px); margin:0; font-size:clamp(16px,1.55vw,23px); line-height:1; font-weight:400; letter-spacing:-.055em; text-shadow:0 1px 5px rgba(0,0,0,.3); }
    .desktop-item { appearance:none; border:0; background:transparent; color:#fff; cursor:grab; position:absolute; z-index:1; width:132px; display:grid; justify-items:center; gap:7px; padding:0; font:inherit; text-shadow:0 1px 4px rgba(0,0,0,.82); user-select:none; touch-action:none; }
    .desktop-item.dragging { cursor:grabbing; z-index:3; }
    .desktop-item:focus-visible { outline:1px solid rgba(255,255,255,.9); outline-offset:5px; border-radius:4px; }
    .thumb { width:68px; height:51px; overflow:hidden; border:2px solid rgba(255,255,255,.92); box-shadow:0 3px 10px rgba(0,0,0,.45); background:#111; }
    .thumb video { width:100%; height:100%; display:block; object-fit:cover; }
    .label { font-size:12px; font-weight:500; letter-spacing:-.025em; max-width:132px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .folder { width:112px; }
    .folder img { width:72px; display:block; filter:drop-shadow(0 4px 5px rgba(0,0,0,.32)); }
    .folder .label { font-size:13px; }
    .hint { position:absolute; z-index:1; left:50%; bottom:20px; transform:translateX(-50%); margin:0; font-size:12px; text-shadow:0 1px 4px #000; opacity:.9; white-space:nowrap; }
    .window { display:none; position:fixed; z-index:10; left:50%; top:50%; width:min(800px,calc(100vw - 32px)); background:#f2f2f2; border:1px solid rgba(0,0,0,.2); border-radius:12px; overflow:hidden; transform:translate(-50%,-50%); box-shadow:0 22px 70px rgba(0,0,0,.62); color:#111; }
    .window.open { display:block; animation:open .18s ease-out; }
    @keyframes open { from { opacity:0; transform:translate(-50%,-45%) scale(.94); } to { opacity:1; transform:translate(-50%,-50%) scale(1); } }
    .titlebar { height:42px; display:flex; align-items:center; gap:8px; padding:0 14px; background:linear-gradient(#f5f5f5,#dedede); border-bottom:1px solid #bababa; cursor:grab; }
    .dot { width:13px; height:13px; padding:0; border-radius:50%; border:1px solid rgba(0,0,0,.16); cursor:pointer; flex:0 0 auto; }
    .red { background:#ff5f57; } .yellow { background:#ffbd2e; } .green { background:#28c840; }
    .title { margin-left:6px; font-size:13px; font-weight:600; color:#3a3a3a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .player { width:100%; max-height:calc(100svh - 140px); display:block; background:#000; }
    .folder-content { padding:27px 28px 30px; background:#f7f7f7; min-height:150px; }
    .folder-content h2 { margin:0 0 8px; font-size:22px; letter-spacing:-.05em; font-weight:600; }
    .folder-content p { margin:0; font-size:15px; line-height:1.45; color:#545454; }
    .overlay { display:none; position:fixed; inset:0; z-index:9; background:rgba(0,0,0,.15); }
    .overlay.visible { display:block; }
    .window.full { width:100vw; height:100svh; max-width:none; border-radius:0; }
    .window.full .titlebar { height:44px; }
    .window.full .player { height:calc(100svh - 44px); max-height:none; object-fit:contain; }

    @media (max-width:620px) {
      .desktop-item { transform:scale(.88); transform-origin:top left; }
      .hint { bottom:10px; font-size:11px; }
    }
  </style>
</head>

<body>
  <main class="desktop" id="desktop">
    <h1 class="brand">Mariana Mina</h1>

    <button class="desktop-item video-file" style="left:11%;top:18%" type="button" data-video="video1.MP4">
      <span class="thumb"><video src="video1.MP4" muted loop playsinline preload="metadata"></video></span>
      <span class="label">vídeo 01</span>
    </button>

    <button class="desktop-item video-file" style="left:36%;top:15%" type="button" data-video="video2.MP4">
      <span class="thumb"><video src="video2.MP4" muted loop playsinline preload="metadata"></video></span>
      <span class="label">vídeo 02</span>
    </button>

    <button class="desktop-item video-file" style="left:63%;top:22%" type="button" data-video="video3.MP4">
      <span class="thumb"><video src="video3.MP4" muted loop playsinline preload="metadata"></video></span>
      <span class="label">vídeo 03</span>
    </button>

    <button class="desktop-item video-file" style="left:20%;top:52%" type="button" data-video="video4.MP4">
      <span class="thumb"><video src="video4.MP4" muted loop playsinline preload="metadata"></video></span>
      <span class="label">vídeo 04</span>
    </button>

    <button class="desktop-item video-file" style="left:49%;top:48%" type="button" data-video="video5.MP4">
      <span class="thumb"><video src="video5.MP4" muted loop playsinline preload="metadata"></video></span>
      <span class="label">vídeo 05</span>
    </button>

    <button class="desktop-item video-file" style="left:78%;top:50%" type="button" data-video="video6.MP4">
      <span class="thumb"><video src="video6.MP4" muted loop playsinline preload="metadata"></video></span>
      <span class="label">vídeo 06</span>
    </button>

    <button class="desktop-item video-file" style="left:40%;top:72%" type="button" data-video="video7.MP4">
      <span class="thumb"><video src="video7.MP4" muted loop playsinline preload="metadata"></video></span>
      <span class="label">vídeo 07</span>
    </button>

    <button class="desktop-item folder" style="left:69%;top:70%" type="button" data-open="about-window">
      <img src="folder.PNG" alt="" />
      <span class="label">sobre mim</span>
    </button>

    <button class="desktop-item folder" style="left:8%;top:72%" type="button" data-open="resume-window">
      <img src="folder.PNG" alt="" />
      <span class="label">currículo</span>
    </button>

    <button class="desktop-item folder" style="left:82%;top:76%" type="button" data-open="contact-window">
      <img src="folder.PNG" alt="" />
      <span class="label">contato</span>
    </button>

    <p class="hint">arraste os arquivos ou clique para abrir</p>
  </main>

  <div class="overlay" id="overlay"></div>

  <section class="window" id="video-window">
    <div class="titlebar">
      <button class="dot red" data-close></button>
      <span class="dot yellow"></span>
      <button class="dot green" data-full></button>
      <span class="title" id="video-title"></span>
    </div>
    <video class="player" id="main-video" controls playsinline></video>
  </section>

  <section class="window" id="about-window">
    <div class="titlebar">
      <button class="dot red" data-close></button>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="title">sobre mim</span>
    </div>
    <div class="folder-content">
      <h2>Mariana Mina</h2>
      <p>Texto sobre a Mariana entra aqui.</p>
    </div>
  </section>

  <section class="window" id="resume-window">
    <div class="titlebar">
      <button class="dot red" data-close></button>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="title">currículo</span>
    </div>
    <div class="folder-content">
      <h2>Currículo</h2>
      <p>Depois, podemos colocar aqui o PDF do currículo para abrir ou baixar.</p>
    </div>
  </section>

  <section class="window" id="contact-window">
    <div class="titlebar">
      <button class="dot red" data-close></button>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="title">contato</span>
    </div>
    <div class="folder-content">
      <h2>Vamos conversar?</h2>
      <p>Coloque aqui o e-mail e os contatos da Mariana.</p>
    </div>
  </section>

  <script>
    const desktop = document.querySelector('#desktop');
    const overlay = document.querySelector('#overlay');
    const mainVideo = document.querySelector('#main-video');
    const videoWindow = document.querySelector('#video-window');
    const videoTitle = document.querySelector('#video-title');

    document.querySelectorAll('.thumb video').forEach(v => v.play().catch(() => {}));

    function closeAll() {
      document.querySelectorAll('.window').forEach(w => w.classList.remove('open', 'full'));
      overlay.classList.remove('visible');
      mainVideo.pause();
    }

    function openWindow(id) {
      document.querySelector('#' + id).classList.add('open');
      overlay.classList.add('visible');
    }

    document.querySelectorAll('[data-open]').forEach(item => {
      item.addEventListener('click', () => {
        if (!item.dataset.dragged) openWindow(item.dataset.open);
      });
    });

    document.querySelectorAll('.video-file').forEach(item => {
      item.addEventListener('click', () => {
        if (item.dataset.dragged) return;

        mainVideo.src = item.dataset.video;
        videoTitle.textContent = item.dataset.video;
        openWindow('video-window');
        mainVideo.currentTime = 0;
        mainVideo.muted = false;
        mainVideo.play().catch(() => {});
      });
    });

    document.querySelectorAll('[data-close]').forEach(btn => btn.addEventListener('click', closeAll));
    overlay.addEventListener('click', closeAll);
    document.querySelector('[data-full]').addEventListener('click', () => videoWindow.classList.toggle('full'));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });

    document.querySelectorAll('.desktop-item').forEach(item => {
      let startX, startY, originX, originY, moved;

      item.addEventListener('pointerdown', e => {
        if (e.button !== undefined && e.button !== 0) return;

        const box = item.getBoundingClientRect();
        const desk = desktop.getBoundingClientRect();

        startX = e.clientX;
        startY = e.clientY;
        originX = box.left - desk.left;
        originY = box.top - desk.top;
        moved = false;

        item.setPointerCapture(e.pointerId);
        item.classList.add('dragging');
      });

      item.addEventListener('pointermove', e => {
        if (!item.hasPointerCapture(e.pointerId)) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (Math.abs(dx) + Math.abs(dy) > 5) moved = true;

        const maxX = desktop.clientWidth - item.offsetWidth;
        const maxY = desktop.clientHeight - item.offsetHeight;

        item.style.left = Math.max(0, Math.min(maxX, originX + dx)) + 'px';
        item.style.top = Math.max(0, Math.min(maxY, originY + dy)) + 'px';
        item.style.right = 'auto';
        item.style.bottom = 'auto';
      });

      item.addEventListener('pointerup', e => {
        item.releasePointerCapture?.(e.pointerId);
        item.classList.remove('dragging');
        item.dataset.dragged = moved ? '1' : '';
        setTimeout(() => item.dataset.dragged = '', 0);
      });

      item.addEventListener('pointercancel', e => {
        item.releasePointerCapture?.(e.pointerId);
        item.classList.remove('dragging');
      });
    });
  </script>
</body>
</html>
